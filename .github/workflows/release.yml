# Every push to main: run the tests, build MeToDo.app, and publish it as a GitHub Release.
# Installed copies of MeToDo check the latest release and update themselves.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  smoke:
    uses: ./.github/workflows/smoke.yml

  release:
    needs: smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the version number is the commit count

      - name: Test
        run: swift test

      - name: Build
        run: ./scripts/build-app.sh
        env:
          METODO_UPDATE_REPO: ${{ github.repository }}

      - name: Package
        run: ditto -c -k --keepParent .build/MeToDo.app MeToDo.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD=$(git rev-list --count HEAD)
          TAG="v1.0.$BUILD"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"; exit 0
          fi
          PREVIOUS=$(git describe --tags --abbrev=0 2>/dev/null || true)
          NOTES=$(git log --no-merges --pretty='- %s' ${PREVIOUS:+$PREVIOUS..}HEAD | head -40)
          gh release create "$TAG" MeToDo.zip \
            --title "MeToDo 1.0.$BUILD" \
            --notes "${NOTES:-Latest build of main.}" \
            --target "$GITHUB_SHA"
